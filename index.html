<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>LIGA DE PAISES - Interactivo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.min.js"></script>
    <script src="connection.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #0d0d0d;
            font-family: 'Outfit', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #dimensionIndicator {
            position: fixed;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 242, 234, 0.8);
            color: black;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 900;
            font-family: monospace;
            font-size: 16px;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 10px rgba(0, 242, 234, 0.5);
            transition: opacity 0.3s;
        }

        /* ---------------- CONTROLES SUPERIORES ---------------- */
        #configPanel {
            width: 100%; padding: 8px; background: rgba(20, 20, 20, 0.95);
            text-align: center; z-index: 2000; border-bottom: 2px solid #333;
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
            align-items: center; transition: transform 0.3s ease;
        }
        #configPanel.hidden { transform: translateY(-100%); position: absolute; }
        .control-group { display: flex; flex-direction: column; align-items: center; }
        .control-group p { margin: 0 0 2px 0; font-size: 10px; color: #ccc; }
        .inputFields input[type="text"] { padding: 4px 8px; font-size: 11px; border-radius: 8px; border: 1px solid #444; background: #000; color: white; outline: none; }
        .inputFields button, .inputFields input[type="button"] { padding: 4px 10px; font-size: 11px; border-radius: 8px; border: none; background: linear-gradient(90deg, #ff0050, #00f2ea); color: white; font-weight: 700; cursor: pointer; }
        #toggleControlsBtn { position: absolute; top: 5px; right: 10px; background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; z-index: 2500; font-size: 12px; }

        /* ---------------- CONTENEDOR CENTRAL ---------------- */
        #gameContainer {
            width: 606px;
            height: 556px;
            min-width: 450px;
            min-height: 400px;
            max-width: 95vw;
            max-height: 95vh;
            resize: both;
            position: relative;
            background: radial-gradient(circle at center, #2e1f1f 0%, #110808 100%);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border: 2px solid #333;
            margin-top: 10px;
        }

        #gameHeader {
            margin-top: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; width: 100%; position: relative;
        }
        #gameHeader h1 { margin: 0 0 15px 0; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; font-weight: 900; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        #headerTimer {
            position: absolute; right: 20px; top: -5px; display: flex; flex-direction: column; align-items: center; gap: 2px; z-index: 100;
        }
        .timer-icon { width: 35px; height: 35px; filter: drop-shadow(0 0 5px #00f2ea); }
        #timerText { font-size: 28px; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(0,0,0,0.8); font-family: 'Outfit', sans-serif; line-height: 1; }

        /* PANELES SUPERIORES (Última Cabra y Goleadores) */
        #topPanels {
            display: flex;
            justify-content: center;
            width: 95%;
            gap: 10px;
            margin-bottom: 10px;
        }

        .stat-panel {
            flex: 1;
            background: rgba(40, 25, 20, 0.6);
            border: 1px solid rgba(255,200,100,0.3);
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            position: relative;
            height: 60px;
        }

        /* Panel Izquierdo: Última Cabra (Historial 3) */
        .cabra-list { display: flex; gap: 8px; align-items: center; }
        .cabra-flag-container { position: relative; }
        .cabra-crown { position: absolute; top: -12px; left: -4px; width: 22px; filter: drop-shadow(0 0 4px gold); z-index: 5; }
        .cabra-flag { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; background: #222; }
        .cabra-info { display: flex; flex-direction: column; }
        .cabra-title { font-size: 8px; font-weight: 900; color: #ddd; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }

        /* Panel Derecho: Goleadores */
        .goleadores-info { display: flex; flex-direction: column; width: 100%; }
        .goleadores-title { font-size: 8px; font-weight: 900; color: #ddd; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; text-align: left; }
        
        .goleadores-users {
            display: flex; gap: 15px; margin-top: 5px; justify-content: flex-start; width: 100%;
        }
        .goleador-item-ui {
            display: flex; flex-direction: column; align-items: center; position: relative;
        }
        .goleador-avatar-real {
            width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; background: #555;
        }
        .goleador-avatar-flag {
            width: 16px; height: 16px; border-radius: 50%; object-fit: cover; border: 1px solid #000; margin-top: -8px; z-index: 2;
        }
        .goleador-goles {
            font-size: 10px; font-weight: 900; color: #00f2ea; margin-top: 2px;
        }

        /* ---------------- PODIO OVERLAY ---------------- */
        #podiumOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            z-index: 5000; display: none; flex-direction: column;
            align-items: center; justify-content: center;
        }
        #podiumOverlay.active { display: flex; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .podium-title { font-size: 32px; font-weight: 900; color: gold; text-transform: uppercase; margin-bottom: 30px; text-shadow: 0 0 20px rgba(255,215,0,0.5); text-align: center;}
        .podium-container { display: flex; align-items: flex-end; gap: 15px; height: 250px; }
        
        .podium-slot { display: flex; flex-direction: column; align-items: center; width: 100px; }
        .podium-flag { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 0 15px rgba(255,255,255,0.5); z-index: 2; background: #222; }
        .podium-name { font-size: 14px; font-weight: 900; margin-top: 5px; text-transform: uppercase; color: #fff; text-shadow: 0 2px 4px #000; z-index: 2; text-align: center; }
        .podium-pts { font-size: 12px; font-weight: 700; color: #0f0; margin-bottom: -10px; z-index: 2;}

        .podium-bar { width: 100%; border-top-left-radius: 10px; border-top-right-radius: 10px; display: flex; justify-content: center; padding-top: 10px; font-size: 24px; font-weight: 900; color: rgba(0,0,0,0.8); position: relative; margin-top: 10px; box-shadow: inset 0 5px 10px rgba(255,255,255,0.3); }
        
        .slot-1 .podium-bar { height: 160px; background: linear-gradient(180deg, #ffd700, #b8860b); }
        .slot-1 .podium-flag { width: 80px; height: 80px; border-color: gold; box-shadow: 0 0 30px rgba(255,215,0,0.8); }
        .slot-2 .podium-bar { height: 120px; background: linear-gradient(180deg, #e0e0e0, #888); }
        .slot-2 .podium-flag { border-color: silver; }
        .slot-3 .podium-bar { height: 90px; background: linear-gradient(180deg, #cd7f32, #8b4513); }
        .slot-3 .podium-flag { border-color: #cd7f32; }

        /* Banner x3 Puntos Dinámico (Píldora) */
        #bonusBanner {
            padding: 3px 15px; border-radius: 20px; font-weight: 900; font-size: 11px;
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            transition: all 0.3s; margin-bottom: 10px; z-index: 20;
        }
        .bonus-active {
            background: linear-gradient(90deg, #ff3b00, #ff0000); border: 1.5px solid rgba(255,255,255,0.4); box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            animation: bounce 0.5s infinite alternate; color: white;
        }
        .bonus-inactive {
            background: rgba(30, 30, 40, 0.8); border: 1.5px solid rgba(255,255,255,0.2); color: #aaa;
        }
        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.05); } }

        /* ---------------- DOS COLUMNAS DE PAISES ---------------- */
        #gameColumns { display: flex; width: 96%; justify-content: space-between; gap: 10px; margin-top: 5px; flex-grow: 1; margin-bottom: 70px;}
        .column { flex: 1; display: flex; flex-direction: column; gap: 6px; }

        .country-row {
            display: flex; align-items: center; background: rgba(220, 220, 220, 0.9); border-radius: 18px;
            padding: 3px 6px; height: 34px; position: relative; color: #000; overflow: hidden; border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .left-icon-container { width: 28px; height: 28px; display: flex; justify-content: center; align-items: center; margin-right: 8px; z-index: 10; }
        .gift-icon { width: 24px; height: 24px; object-fit: contain; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));}

        .ronda-text { font-size: 12px; font-weight: 700; color: #555; margin-right: 10px; z-index: 10; min-width: 60px; }
        .ronda-text span { color: #000; font-weight: 900; font-size: 13px; }

        .flag-circle { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; border: 1px solid #ccc; margin-right: 8px; flex-shrink: 0; z-index: 10; }
        .flag-circle img { width: 100%; height: 100%; object-fit: cover; }
        .country-name { font-size: 13px; font-weight: 900; text-transform: uppercase; color: #111; z-index: 10; letter-spacing: 0.5px; }

        /* Barra de progreso Amarillo (como en la imagen para el row) */
        .progress-fill {
            position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
            background: linear-gradient(90deg, #adff2f 0%, #ffff00 100%); z-index: 1; transition: width 0.3s; border-radius: 18px;
        }



        /* ---------------- NOTIFICACIONES ---------------- */
        #notificationArea { position: absolute; top: 180px; width: 100%; display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 100; }
        .join-msg { background: white; color: black; padding: 4px 12px; border-radius: 12px; font-size: 10px; font-weight: 900; margin-bottom: 4px; animation: slideInDown 0.4s forwards, fadeOut 1s 2s forwards; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        @keyframes slideInDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; } }
        .hit { transform: scale(1.03); transition: 0.1s; filter: brightness(1.1); }
    </style>
</head>

<body>
    <button id="toggleControlsBtn" title="Ocultar/Mostrar Controles">⚙️</button>
    
    <div id="configPanel" class="inputFields">
        <div class="control-group">
            <p>Conectar TikTok</p>
            <div>
                <input type="text" id="uniqueIdInput" placeholder="@usuario">
                <input type="button" id="connectButton" value="Conectar">
                <input type="button" id="connectTikFinity" value="TikFinity App" style="background: #333;">
            </div>
            <span id="stateText" style="font-size:9px; color: #777;">Desconectado</span>
        </div>
        <div class="control-group">
            <p>Partido Automático</p>
            <div style="display: flex; gap:5px;">
                <input type="button" id="startBtn" value="Iniciar 5 Min" style="background: #00cc66;">
                <input type="button" id="forceEndBtn" value="Forzar Fin">
                <input type="button" id="resetBtn" value="Reset Stats" style="background: #a00;">
            </div>
        </div>
    </div>

    <div id="dimensionIndicator">700 x 520 px</div>

    <!-- CONTENEDOR CENTRAL: PAÍSES Y TIMER -->
    <div id="gameContainer">
        <div id="gameHeader">
            <h1>LIGA DE PAISES</h1>
            <div id="headerTimer">
                <img src="https://cdn-icons-png.flaticon.com/512/3239/3239147.png" class="timer-icon">
                <span id="timerText">05:00</span>
            </div>
            
            <!-- PANELES LATERALES (AHORA COMO ICONOS SUPERIORES) -->
            <div id="topPanels">
                <!-- Panel Historial Ganadores (Última Cabra) -->
                <div class="stat-panel" style="background: linear-gradient(135deg, #422a10 0%, #29180b 100%);">
                    <div class="cabra-info">
                        <span class="cabra-title">Última Cabra</span>
                        <div class="cabra-list" id="historicWinnersList">
                            <span style="font-size: 9px; color: #888; font-style: italic;">Sin ganadores</span>
                        </div>
                    </div>
                </div>

                <!-- Panel Top Goleadores -->
                <div class="stat-panel" style="background: linear-gradient(135deg, #383838 0%, #202020 100%); border-color: rgba(255,255,255,0.2);">
                    <div class="goleadores-info">
                        <span class="goleadores-title">Goleadores</span>
                        <div class="goleadores-users" id="goleadoresList">
                            <span style="font-size: 9px; color: #666; font-weight: normal; font-style: italic;">Sin datos</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- BANNER X3 -->
            <div id="bonusBanner" class="bonus-inactive">
                <span id="bonusText">Sin bonus activo</span>
            </div>
        </div>

        <div id="notificationArea"></div>

        <div id="podiumOverlay">
            <div class="podium-title">¡GANADORES DE LA RONDA!</div>
            <div class="podium-container">
                <!-- 2do Lugar -->
                <div class="podium-slot slot-2">
                    <img id="pod-2-flag" class="podium-flag" src="https://flagcdn.com/w80/xx.png">
                    <span id="pod-2-pts" class="podium-pts">0 pts</span>
                    <div class="podium-bar">2</div>
                    <span id="pod-2-name" class="podium-name">Nadie</span>
                </div>
                <!-- 1er Lugar -->
                <div class="podium-slot slot-1">
                    <img id="pod-1-flag" class="podium-flag" src="https://flagcdn.com/w80/xx.png">
                    <span id="pod-1-pts" class="podium-pts">0 pts</span>
                    <div class="podium-bar">1</div>
                    <span id="pod-1-name" class="podium-name">Nadie</span>
                </div>
                <!-- 3er Lugar -->
                <div class="podium-slot slot-3">
                    <img id="pod-3-flag" class="podium-flag" src="https://flagcdn.com/w80/xx.png">
                    <span id="pod-3-pts" class="podium-pts">0 pts</span>
                    <div class="podium-bar">3</div>
                    <span id="pod-3-name" class="podium-name">Nadie</span>
                </div>
            </div>
        </div>

        <div id="gameColumns">
            <div class="column" id="col1"></div>
            <div class="column" id="col2"></div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('gameContainer');
            const indicator = document.getElementById('dimensionIndicator');
            new ResizeObserver(entries => {
                for (let entry of entries) {
                    indicator.innerText = `${Math.round(entry.contentRect.width)} x ${Math.round(entry.contentRect.height)} px`;
                }
            }).observe(container);
        });

        const countriesData = [
            { id: 'mx', name: 'México', icon: 'rosa.png', key: '1', audio: 'mexico.mp3', giftId: 5655 },
            { id: 'gt', name: 'Guatemala', icon: 'tiktok.png', key: '2', audio: 'guatemala.mp3', giftId: 6269 },
            { id: 'do', name: 'R. Dominicana', icon: 'mazorca.png', key: '3', audio: 'dominicana.mp3', giftId: 7096 },
            { id: 'ar', name: 'Argentina', icon: 'gg.png', key: '4', audio: 'argentina.mp3', giftId: 6064 },
            { id: 'co', name: 'Colombia', icon: 'helado.png', key: '5', audio: 'colombia.mp3', giftId: 5827 },
            { id: 'cl', name: 'Chile', icon: 'rosablanca.png', key: '6', audio: 'chile.mp3', giftId: 8239 },
            { id: 'pe', name: 'Perú', icon: 'increible.png', key: '7', audio: 'peru.mp3', giftId: 15232 },
            { id: 've', name: 'Venezuela', icon: 'maracas.png', key: '8', audio: 'venezuela.mp3', giftId: 7032 },
            { id: 'ec', name: 'Ecuador', icon: 'teadoro.png', key: '9', audio: 'ecuador.mp3', giftId: 15231 },
            { id: 'py', name: 'Paraguay', icon: 'alas.png', key: '0', audio: 'paraguay.mp3', giftId: 15104 },
            { id: 'bo', name: 'Bolivia', icon: 'creeper.png', key: 'q', audio: 'bolivia.mp3', giftId: 54724 },
            { id: 'hn', name: 'Honduras', icon: 'pastel.png', key: 'w', audio: 'honduras.mp3', giftId: 6784 },
            { id: 'es', name: 'España', icon: 'estilolibre.png', key: 'e', audio: 'españa.mp3', giftId: 19441 },
            { id: 'uy', name: 'Uruguay', icon: 'pop.png', key: 'r', audio: 'uruguay.mp3', giftId: 19438 }
        ];

        let userStats = {}; 
        let historicWinners = []; // Array de {id: 'mx'}

        countriesData.forEach(c => { c.points = 0; c.round = 0; });
        const POINTS_PER_ROUND = 20;

        function initUI() {
            const col1 = document.getElementById('col1');
            const col2 = document.getElementById('col2');
            col1.innerHTML = ''; col2.innerHTML = '';
            
            countriesData.forEach((c, index) => {
                const row = document.createElement('div');
                row.className = 'country-row';
                row.id = `row-${c.id}`;
                row.innerHTML = `
                    <div class="progress-fill" id="fill-${c.id}"></div>
                    <div class="left-icon-container"><img src="${c.icon}" class="gift-icon"></div>
                    <div class="ronda-text">Ronda: <span id="round-${c.id}">0</span></div>
                    <div class="flag-circle"><img src="https://flagcdn.com/w160/${c.id}.png"></div>
                    <div class="country-name">${c.name}</div>
                `;
                if (index < 7) col1.appendChild(row);
                else col2.appendChild(row);
            });
        }

        initUI();

        const audioQueue = [];
        let isAudioPlaying = false;

        function checkAudioQueue() {
            if (isAudioPlaying || audioQueue.length === 0) return;
            isAudioPlaying = true;
            
            const countryAudio = audioQueue.shift();
            let a1 = new Audio(countryAudio);
            
            const playEfecto = () => {
                let a2 = new Audio("efecto.mp3");
                a2.onended = a2.onerror = () => {
                    isAudioPlaying = false;
                    checkAudioQueue();
                };
                let p2 = a2.play();
                if(p2) {
                    p2.catch(() => { isAudioPlaying = false; checkAudioQueue(); });
                }
            };
            
            a1.onended = a1.onerror = playEfecto;
            let p1 = a1.play();
            if(p1) {
                p1.catch(() => playEfecto());
            }
        }

        function playSoundSequence(countryAudio) {
            audioQueue.push(countryAudio);
            checkAudioQueue();
        }

        function addPoint(countryId, username = "Admin", rawIncrement = 1, profilePicUrl = "") {
            const c = countriesData.find(x => x.id === countryId);
            if (!c) return;

            const increment = isX3Active ? rawIncrement * 3 : rawIncrement;
            const oldPoints = c.points;
            c.points += increment;
            c.round = Math.floor(c.points / POINTS_PER_ROUND);

            // Verificamos si pasaron 10 pasos (es decir, cruzaron un múltiplo de 10)
            if (Math.floor(oldPoints / 10) < Math.floor(c.points / 10)) {
                playSoundSequence(c.audio);
            }

            document.getElementById(`round-${c.id}`).innerText = c.round;
            document.getElementById(`fill-${c.id}`).style.width = ((c.points % POINTS_PER_ROUND) / POINTS_PER_ROUND * 100) + '%';
            
            const row = document.getElementById(`row-${c.id}`);
            row.classList.add('hit');
            setTimeout(() => row.classList.remove('hit'), 150);

            // Goleadores Update
            if (!userStats[username]) userStats[username] = { points: 0, countryId: c.id, pic: profilePicUrl || 'https://cdn-icons-png.flaticon.com/512/149/149071.png' };
            userStats[username].points += increment;
            userStats[username].countryId = c.id; 
            if(profilePicUrl) userStats[username].pic = profilePicUrl; // Actualizar foto si entra
            
            updateGoleadoresUI();
        }

        let goleadoresUpdateTimeout = null;
        function updateGoleadoresUI() {
            if (goleadoresUpdateTimeout) return;
            goleadoresUpdateTimeout = setTimeout(() => {
                const list = document.getElementById('goleadoresList');
                const topUsers = Object.entries(userStats)
                                       .sort((a,b) => b[1].points - a[1].points)
                                       .slice(0, 3);
                
                if (topUsers.length === 0) {
                    list.innerHTML = '<span style="font-size: 9px; color: #666; font-style: italic;">Sin datos</span>';
                    goleadoresUpdateTimeout = null;
                    return;
                }

                list.innerHTML = topUsers.map(([usr, data], i) => {
                    let initial = usr.charAt(0).toUpperCase();
                    let avatarHtml = `<img src="${data.pic}" class="goleador-avatar-real" title="${usr}">`;
                    if(data.pic.includes('149071.png')) {
                        avatarHtml = `<div class="goleador-avatar-real" style="display:flex; justify-content:center; align-items:center; color:#fff; font-size:14px; background:#444;" title="${usr}">${initial}</div>`;
                    }
                    
                    return `
                    <div class="goleador-item-ui">
                        ${avatarHtml}
                        <img class="goleador-avatar-flag" src="https://flagcdn.com/w20/${data.countryId}.png">
                        <span class="goleador-goles">${data.points} pts</span>
                    </div>
                    `;
                }).join('');
                goleadoresUpdateTimeout = null;
            }, 100); // Actualiza máximo cada 100ms
        }

        document.addEventListener('keydown', (e) => {
            const country = countriesData.find(c => c.key === e.key.toLowerCase());
            // Genera nombres fake para simular goleadores distintos al usar diferentes teclas
            const mockName = "User" + Math.floor(Math.random() * 5); 
            const mockPics = ["https://randomuser.me/api/portraits/men/32.jpg", "https://randomuser.me/api/portraits/women/44.jpg", "https://randomuser.me/api/portraits/men/86.jpg", "https://randomuser.me/api/portraits/women/21.jpg", "https://randomuser.me/api/portraits/lego/1.jpg"];
            const mockPic = mockPics[Math.floor(Math.random() * mockPics.length)];
            if (country) addPoint(country.id, mockName, 1, mockPic);
        });

        /* OCULTAR CONTROLES */
        document.getElementById('toggleControlsBtn').onclick = () => {
            document.getElementById('configPanel').classList.toggle('hidden');
        };

        /* LÓGICA X3 (2 Min Inactivo, 30s Activo) */
        let isX3Active = false;
        let x3TimerInt = null;

        function runX3Cycle() {
            isX3Active = false;
            const banner = document.getElementById('bonusBanner');
            const bonusText = document.getElementById('bonusText');
            
            banner.className = 'bonus-inactive';
            bonusText.innerText = 'Sin bonus activo';

            setTimeout(() => {
                isX3Active = true;
                banner.className = 'bonus-active';
                let timeLeft = 30;
                bonusText.innerHTML = `x3 Puntos de Regalo | <span style="font-weight:400">${timeLeft}s</span>`;
                
                x3TimerInt = setInterval(() => {
                    timeLeft--;
                    bonusText.innerHTML = `x3 Puntos de Regalo | <span style="font-weight:400">${timeLeft}s</span>`;
                    if (timeLeft <= 0) {
                        clearInterval(x3TimerInt);
                        runX3Cycle(); 
                    }
                }, 1000);
            }, 120000); 
        }
        runX3Cycle();

        /* LÓGICA DE PARTIDO 5 MINUTOS (Bucle) */
        let timerSeconds = 300; 
        let mainTimerInt = null;
        let isGameRunning = false;

        function updateMainTimer() {
            const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
            const s = (timerSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timerText').innerText = `${m}:${s}`;
        }

        function handleMatchEnd() {
            clearInterval(mainTimerInt);
            isGameRunning = false;
            
            const sortedCountries = [...countriesData].sort((a,b) => b.points - a.points);
            const winner = sortedCountries[0];
            const podiumOverlay = document.getElementById('podiumOverlay');
            
            if (winner && winner.points > 0) {
                // Actualizar Historial de Ganadores (Última Cabra)
                historicWinners.unshift({ id: winner.id });
                if (historicWinners.length > 3) historicWinners.pop();
                updateHistoricWinnersUI();
                
                // Mostrar Podio
                document.getElementById('pod-1-flag').src = `https://flagcdn.com/w160/${sortedCountries[0].id}.png`;
                document.getElementById('pod-1-name').innerText = sortedCountries[0].name;
                document.getElementById('pod-1-pts').innerText = sortedCountries[0].points + " pts";
                
                if(sortedCountries[1] && sortedCountries[1].points > 0) {
                    document.getElementById('pod-2-flag').src = `https://flagcdn.com/w160/${sortedCountries[1].id}.png`;
                    document.getElementById('pod-2-name').innerText = sortedCountries[1].name;
                    document.getElementById('pod-2-pts').innerText = sortedCountries[1].points + " pts";
                } else {
                    document.getElementById('pod-2-flag').src = `https://flagcdn.com/w80/xx.png`;
                    document.getElementById('pod-2-name').innerText = "Nadie";
                    document.getElementById('pod-2-pts').innerText = "0 pts";
                }
                
                if(sortedCountries[2] && sortedCountries[2].points > 0) {
                    document.getElementById('pod-3-flag').src = `https://flagcdn.com/w160/${sortedCountries[2].id}.png`;
                    document.getElementById('pod-3-name').innerText = sortedCountries[2].name;
                    document.getElementById('pod-3-pts').innerText = sortedCountries[2].points + " pts";
                } else {
                    document.getElementById('pod-3-flag').src = `https://flagcdn.com/w80/xx.png`;
                    document.getElementById('pod-3-name').innerText = "Nadie";
                    document.getElementById('pod-3-pts').innerText = "0 pts";
                }
                
                podiumOverlay.classList.add('active');
            }

            // Esperar 10s viendo el podio antes de reiniciar el match visualmente
            setTimeout(() => {
                podiumOverlay.classList.remove('active');
                
                countriesData.forEach(c => {
                    c.points = 0; c.round = 0;
                    document.getElementById(`round-${c.id}`).innerText = '0';
                    document.getElementById(`fill-${c.id}`).style.width = '0%';
                });
                
                // IMPORTANTE: NO se limpia userStats para que los goleadores sean persistentes!
                
                startGame(); 
            }, winner && winner.points > 0 ? 10000 : 0);
        }

        function updateHistoricWinnersUI() {
            const list = document.getElementById('historicWinnersList');
            if (historicWinners.length === 0) {
                list.innerHTML = '<span style="font-size: 9px; color: #888; font-style: italic;">Sin ganadores</span>';
                return;
            }
            list.innerHTML = historicWinners.map(w => `
                <div class="cabra-flag-container">
                    <img src="https://cdn-icons-png.flaticon.com/512/6941/6941697.png" class="cabra-crown">
                    <img src="https://flagcdn.com/w80/${w.id}.png" class="cabra-flag">
                </div>
            `).join('');
        }

        function startGame() {
            if (mainTimerInt) clearInterval(mainTimerInt);
            timerSeconds = 300;
            isGameRunning = true;
            updateMainTimer();
            
            mainTimerInt = setInterval(() => {
                if (timerSeconds > 0) {
                    timerSeconds--;
                    updateMainTimer();
                } else {
                    handleMatchEnd();
                }
            }, 1000);
        }

        document.getElementById('startBtn').onclick = startGame;
        document.getElementById('forceEndBtn').onclick = handleMatchEnd;
        
        // Inciar juego en bucle automático al cargar
        startGame();
        
        document.getElementById('resetBtn').onclick = () => {
            if(confirm("¿Borrar historial de Goleadores y Ganadores también?")) {
                historicWinners = [];
                updateHistoricWinnersUI();
                userStats = {};
                document.getElementById('goleadoresList').innerHTML = '<span style="font-size: 9px; color: #666; font-style: italic;">Sin datos</span>';
            }
            clearInterval(mainTimerInt);
            isGameRunning = false;
            timerSeconds = 300;
            updateMainTimer();
            
            countriesData.forEach(c => {
                c.points = 0; c.round = 0;
                document.getElementById(`round-${c.id}`).innerText = '0';
                document.getElementById(`fill-${c.id}`).style.width = '0%';
            });
        };

        /* TIKTOK / TIKFINITY DUMMY */
        let connection = new TikTokIOConnection("https://tiktok-chat-reader-nh9k.onrender.com");
        $("#connectButton").click(() => {
            let user = $("#uniqueIdInput").val().trim();
            if(!user) return;
            $("#stateText").html("Conectando...");
            connection.connect(user).then(() => $("#stateText").html("Conectado")).catch(e => $("#stateText").html("Error"));
        });

        /* TIKFINITY DESKTOP WEB SOCKET */
        let tikFinitySocket = null;

        function connectToTikFinity() {
            if (tikFinitySocket) {
                tikFinitySocket.close();
            }

            $("#stateText").html("Conectando TikFinity...");
            tikFinitySocket = new WebSocket("ws://localhost:21213/");

            tikFinitySocket.onopen = () => {
                $("#stateText").html("TikFinity Conectado");
                $("#connectTikFinity").css("background", "#00cc66");
            };

            tikFinitySocket.onclose = () => {
                $("#stateText").html("TikFinity Desconectado");
                $("#connectTikFinity").css("background", "#333");
            };

            tikFinitySocket.onerror = (err) => {
                console.error("WebSocket Error:", err);
                $("#stateText").html("Error TikFinity");
            };

            tikFinitySocket.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    
                    // TikFinity Desktop envía eventos en msg.event
                    if (msg.event === "gift") {
                        const giftData = msg.data;
                        const giftId = giftData.giftId || giftData.gift_id;
                        const count = giftData.amount || 1;
                        const nickname = giftData.nickname || giftData.uniqueId || "Usuario";
                        const profilePic = giftData.profilePictureUrl || "";

                        const country = countriesData.find(c => c.giftId === giftId);
                        if (country) {
                            addPoint(country.id, nickname, count, profilePic);
                        }
                    }
                } catch (e) {
                    console.error("Error parsing TikFinity message:", e);
                }
            };
        }

        $("#connectTikFinity").click(connectToTikFinity);

    </script>
</body>
</html>
